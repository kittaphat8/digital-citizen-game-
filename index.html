<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital RPG: Dynamic Spawning Blocks</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
    </style>
</head>
<body>
    <script>
        let player = { level: 1, exp: 0, maxExp: 50, hp: 100, maxHp: 100, atk: 25 };
        let boss = { level: 1, hp: 150, maxHp: 150, atk: 15 };

        let questionsBank = [
            { q: "ถ้ามีคนทักมาขอรหัสผ่านเกม ควรทำอย่างไร?", a: ["ให้ทันที", "ปฏิเสธและบล็อก"], correct: 1 },
            { q: "การด่าทอผู้อื่นออนไลน์เรียกว่าอะไร?", a: ["Cyberbullying", "Digital Citizen"], correct: 0 },
            { q: "ก่อนแชร์ข่าวสาร ควรทำอย่างไร?", a: ["แชร์ทันที", "ตรวจสอบความจริง"], correct: 1 },
            { q: "พบรูปที่ไม่เหมาะสมของเพื่อนในเน็ต ควรทำอย่างไร?", a: ["แชร์ต่อให้คนอื่นดู", "แจ้งเตือนผู้ปกครอง/ครู"], correct: 1 }
        ];

        let currentMode = 'FARM';
        let hero, ground, obstacles, quizBlocks, cursors;
        let dialogueBox, dialogueText, isTalking = false;
        let uiText, bossBtn, retreatBtn;
        let currentQData = null;
        let bossContainer, bossHpText, bossAtkBtn;

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            backgroundColor: '#2c3e50',
            physics: { 
                default: 'arcade', 
                arcade: { 
                    gravity: { y: 1000 }, 
                    debug: false 
                } 
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            this.load.image('hero', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
        }

        function create() {
            // สร้าง Vector Graphic รูปบอส
            let g = this.add.graphics();
            g.fillStyle(0xd63031, 1);
            g.fillRoundedRect(-60, -60, 120, 120, 20);
            g.fillStyle(0x2d3436, 1);
            g.fillTriangle(-50, -60, -30, -60, -60, -95);
            g.fillTriangle(50, -60, 30, -60, 60, -95);
            g.fillStyle(0xffffff, 1);
            g.fillCircle(-25, -15, 18);
            g.fillCircle(25, -15, 18);
            g.fillStyle(0x000000, 1);
            g.fillCircle(-20, -15, 8);
            g.fillCircle(20, -15, 8);
            g.fillStyle(0x2d3436, 1);
            g.fillRect(-35, 20, 70, 25);
            g.fillStyle(0xffffff, 1);
            g.fillTriangle(-25, 20, -15, 20, -20, 32);
            g.fillTriangle(15, 20, 25, 20, 20, 32);

            g.generateTexture('bossGraphic', 140, 200);
            g.destroy();

            ground = this.add.rectangle(400, 580, 800, 40, 0x27ae60);
            this.physics.add.existing(ground, true);

            hero = this.physics.add.image(200, 100, 'hero');
            hero.setCollideWorldBounds(true);
            hero.setBounce(0.1);
            this.physics.add.collider(hero, ground);

            obstacles = this.physics.add.group();
            quizBlocks = this.physics.add.group();

            this.physics.add.overlap(hero, obstacles, hitObstacle, null, this);
            this.physics.add.overlap(hero, quizBlocks, hitQuizBlock, null, this);

            bossContainer = this.add.image(400, 240, 'bossGraphic').setVisible(false);

            // เริ่มวนสุ่มการปล่อยสิ่งกีดขวาง
            scheduleNextSpawn(this);

            uiText = this.add.text(20, 20, '', { fontSize: '18px', fill: '#fff' });

            bossBtn = this.add.rectangle(700, 40, 140, 40, 0xe74c3c).setInteractive();
            this.add.text(700, 40, 'ไปสู้บอส ➔', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5);
            bossBtn.on('pointerdown', () => switchMode(this, 'BOSS'));

            dialogueBox = this.add.rectangle(400, 300, 740, 140, 0x000000, 0.9).setStrokeStyle(2, 0xffffff).setVisible(false);
            dialogueText = this.add.text(50, 250, '', { fontSize: '18px', fill: '#fff', wordWrap: { width: 700 } }).setVisible(false);

            let btnA = this.add.rectangle(250, 350, 250, 40, 0x2ecc71).setInteractive().setVisible(false);
            let btnAText = this.add.text(250, 350, '', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5).setVisible(false);
            let btnB = this.add.rectangle(550, 350, 250, 40, 0xe67e22).setInteractive().setVisible(false);
            let btnBText = this.add.text(550, 350, '', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5).setVisible(false);

            btnA.on('pointerdown', () => answerQuiz(0, this, btnA, btnB, btnAText, btnBText));
            btnB.on('pointerdown', () => answerQuiz(1, this, btnA, btnB, btnAText, btnBText));

            this.quizUI = { dialogueBox, dialogueText, btnA, btnB, btnAText, btnBText };

            bossHpText = this.add.text(400, 70, '', { fontSize: '22px', fill: '#ff7675', align: 'center' }).setOrigin(0.5).setVisible(false);
            
            bossAtkBtn = this.add.rectangle(400, 420, 180, 50, 0xc0392b).setInteractive().setVisible(false);
            let bossAtkText = this.add.text(400, 420, '⚔️ โจมตีบอส!', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5).setVisible(false);

            retreatBtn = this.add.rectangle(400, 490, 220, 40, 0x34495e).setInteractive().setVisible(false);
            let retreatText = this.add.text(400, 490, '🏃 หนีกลับไปเก็บ Lv.', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5).setVisible(false);

            this.bossUI = { bossAtkText, retreatText };

            bossAtkBtn.on('pointerdown', () => attackBoss(this));
            retreatBtn.on('pointerdown', () => switchMode(this, 'FARM'));

            cursors = this.input.keyboard.createCursorKeys();

            this.input.on('pointerdown', (pointer) => {
                if (currentMode === 'FARM' && !isTalking && hero.body.touching.down && pointer.y > 100) {
                    hero.setVelocityY(-550);
                }
            });

            updateUI();
        }

        // ระบบสุ่มเวลาเกิดแบบต่อเนื่องไม่ซ้ำรอบ
        function scheduleNextSpawn(scene) {
            let nextDelay = Phaser.Math.Between(1200, 3200); // สุ่มเวลาหน่วง 1.2 - 3.2 วินาที
            scene.time.delayedCall(nextDelay, () => {
                spawnObjects(scene);
                scheduleNextSpawn(scene);
            });
        }

        function spawnObjects(scene) {
            if (currentMode !== 'FARM' || isTalking) return;

            let isQuiz = Math.random() < 0.5;
            let randomSpeed = Phaser.Math.Between(200, 380); 
            let spawnX = Phaser.Math.Between(830, 950); 

            if (isQuiz) {
                // บล็อกคำถาม: สุ่มตำแหน่งความสูง Y ตั้งแต่ช่วงกลางถึงระดับกระโดด (280 ถึง 440)
                let randomY = Phaser.Math.Between(280, 440);
                let qBlock = scene.add.rectangle(spawnX, randomY, 40, 40, 0xf1c40f);
                scene.physics.add.existing(qBlock);
                quizBlocks.add(qBlock);
                qBlock.body.setAllowGravity(false);
                qBlock.body.setVelocityX(-randomSpeed);
            } else {
                // สิ่งกีดขวาง: สุ่มความสูงของเสาตึก/สิ่งกีดขวาง (30 ถึง 85 px) และคำนวณตำแหน่ง Y ให้แนบพื้นพอดี
                let randomHeight = Phaser.Math.Between(30, 85);
                let groundTopY = 560;
                let calculatedY = groundTopY - (randomHeight / 2);

                let obs = scene.add.rectangle(spawnX, calculatedY, 40, randomHeight, 0xe74c3c);
                scene.physics.add.existing(obs);
                obstacles.add(obs);
                obs.body.setAllowGravity(false);
                obs.body.setVelocityX(-randomSpeed);
            }
        }

        function hitObstacle(heroObj, obs) {
            obs.destroy();
            player.hp -= 20;

            if (player.hp <= 0) {
                player.hp = 0;
                alert("💔 เลือดหมด! คุณหมดสติ ฟื้นฟูเลือดแล้วเริ่มใหม่");
                player.hp = player.maxHp;
                clearAllObjects();
            }
            updateUI();
        }

        function hitQuizBlock(heroObj, qBlock) {
            qBlock.destroy();
            if (!isTalking) {
                isTalking = true;
                currentQData = questionsBank[Phaser.Math.Between(0, questionsBank.length - 1)];
                
                let ui = this.quizUI;
                ui.dialogueText.setText(`[กระโดดชนบล็อกคำถาม!]\n${currentQData.q}`);
                ui.btnAText.setText(`A: ${currentQData.a[0]}`);
                ui.btnBText.setText(`B: ${currentQData.a[1]}`);

                ui.dialogueBox.setVisible(true);
                ui.dialogueText.setVisible(true);
                ui.btnA.setVisible(true);
                ui.btnB.setVisible(true);
                ui.btnAText.setVisible(true);
                ui.btnBText.setVisible(true);
            }
        }

        function answerQuiz(choice, scene, btnA, btnB, btnAText, btnBText) {
            if (choice === currentQData.correct) {
                player.exp += 30;
                alert("✅ ตอบถูก! ได้รับ +30 EXP");
                if (player.exp >= player.maxExp) {
                    player.level++;
                    player.exp -= player.maxExp;
                    player.maxExp += 30;
                    player.maxHp += 40;
                    player.hp = player.maxHp;
                    player.atk += 15;
                    alert(`🎉 เลเวลอัปเป็น Lv.${player.level}! (เพิ่ม Max HP และ พลังโจมตี)`);
                }
            } else {
                alert("❌ ตอบผิด! ไม่ได้รับ EXP");
            }

            let ui = scene.quizUI;
            ui.dialogueBox.setVisible(false);
            ui.dialogueText.setVisible(false);
            ui.btnA.setVisible(false);
            ui.btnB.setVisible(false);
            ui.btnAText.setVisible(false);
            ui.btnBText.setVisible(false);
            isTalking = false;
            updateUI();
        }

        function switchMode(scene, mode) {
            currentMode = mode;
            let isFarm = mode === 'FARM';

            hero.setVisible(isFarm);
            ground.setVisible(isFarm);
            bossBtn.setVisible(isFarm);

            bossContainer.setVisible(!isFarm);
            bossHpText.setVisible(!isFarm);
            bossAtkBtn.setVisible(!isFarm);
            scene.bossUI.bossAtkText.setVisible(!isFarm);
            retreatBtn.setVisible(!isFarm);
            scene.bossUI.retreatText.setVisible(!isFarm);

            if (!isFarm) {
                clearAllObjects();
                scene.cameras.main.setBackgroundColor('#4a154b');
            } else {
                scene.cameras.main.setBackgroundColor('#2c3e50');
            }
            updateUI();
        }

        function clearAllObjects() {
            obstacles.clear(true, true);
            quizBlocks.clear(true, true);
        }

        function attackBoss(scene) {
            boss.hp -= player.atk;
            if (boss.hp > 0) player.hp -= boss.atk;

            if (boss.hp <= 0) {
                alert(`🏆 ชนะบอส Lv.${boss.level}! บอสได้รับการอัปเกรดเป็น Lv.${boss.level + 1}`);
                boss.level++;
                boss.maxHp += 100;
                boss.hp = boss.maxHp;
                boss.atk += 10;
                switchMode(scene, 'FARM');
            } else if (player.hp <= 0) {
                alert("💀 สู้บอสไม่ไหว HP หมด! หนีกลับไปเก็บเลเวลเพิ่มพลังก่อนนะ");
                player.hp = player.maxHp;
                switchMode(scene, 'FARM');
            }
            updateUI();
        }

        function updateUI() {
            uiText.setText(`Player: Lv.${player.level} | EXP: ${player.exp}/${player.maxExp} | HP: ${player.hp}/${player.maxHp} | ATK: ${player.atk}`);
            bossHpText.setText(`👹 BOSS Lv.${boss.level}\nHP: ${boss.hp}/${boss.maxHp} | ATK: ${boss.atk}`);
        }

        function update() {
            if (currentMode !== 'FARM' || isTalking) return;

            if (cursors.up.isDown && hero.body.touching.down) {
                hero.setVelocityY(-550);
            }
        }
    </script>
</body>
</html>
