<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital RPG: Farm & Boss</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
    </style>
</head>
<body>
    <script>
        // สถานะผู้เล่นและบอส
        let player = { level: 1, exp: 0, maxExp: 50, hp: 100, maxHp: 100, atk: 25 };
        let boss = { level: 1, hp: 150, maxHp: 150, atk: 15 };

        let questions = [
            { q: "ถ้ามีคนทักมาขอรหัสผ่านเกม ควรทำอย่างไร?", a: ["ให้ทันที", "ปฏิเสธและบล็อก"], correct: 1 },
            { q: "การด่าทอผู้อื่นออนไลน์เรียกว่าอะไร?", a: ["Cyberbullying", "Digital Citizen"], correct: 0 },
            { q: "ก่อนแชร์ข่าวสาร ควรทำอย่างไร?", a: ["แชร์ทันที", "ตรวจสอบความจริง"], correct: 1 }
        ];

        let currentMode = 'FARM'; // 'FARM' หรือ 'BOSS'
        let hero, obstacles, npcs, cursors;
        let dialogueBox, dialogueText, isTalking = false;
        let uiText, bossBtn, retreatBtn;
        let currentQ = 0;
        let bossHpText, bossAtkBtn;

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            backgroundColor: '#2c3e50',
            physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            this.load.image('hero', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
        }

        function create() {
            // === โหมดที่ 1: หน้าเก็บเลเวล (FARM) ===
            // สร้างสิ่งกีดขวาง (สีแดง)
            obstacles = this.physics.add.staticGroup();
            let obs1 = this.add.rectangle(300, 300, 100, 40, 0xc0392b);
            let obs2 = this.add.rectangle(500, 150, 40, 120, 0xc0392b);
            this.physics.add.existing(obs1, true);
            this.physics.add.existing(obs2, true);
            obstacles.add(obs1);
            obstacles.add(obs2);

            // สร้าง NPC จุดตอบคำถามเก็บเลเวล (สีเหลือง)
            npcs = this.physics.add.staticGroup();
            let qNpc = this.add.rectangle(650, 450, 40, 40, 0xf1c40f);
            this.physics.add.existing(qNpc, true);
            npcs.add(qNpc);

            // ผู้เล่น
            hero = this.physics.add.image(100, 500, 'hero');
            hero.setCollideWorldBounds(true);
            this.physics.add.collider(hero, obstacles);
            this.physics.add.collider(hero, npcs);

            // UI แสดงค่าพลัง
            uiText = this.add.text(20, 20, '', { fontSize: '18px', fill: '#fff' });

            // ปุ่มไปสู้บอส
            bossBtn = this.add.rectangle(700, 40, 140, 40, 0xe74c3c).setInteractive();
            let bossBtnText = this.add.text(700, 40, 'ไปสู้บอส ➔', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5);
            bossBtn.on('pointerdown', () => switchMode(this, 'BOSS'));

            // กล่องข้อความคำถาม
            dialogueBox = this.add.rectangle(400, 500, 740, 140, 0x000000, 0.9).setStrokeStyle(2, 0xffffff).setVisible(false);
            dialogueText = this.add.text(50, 450, '', { fontSize: '18px', fill: '#fff', wordWrap: { width: 700 } }).setVisible(false);

            // ปุ่มคำตอบ A/B
            let btnA = this.add.rectangle(250, 550, 250, 40, 0x2ecc71).setInteractive().setVisible(false);
            let btnAText = this.add.text(250, 550, '', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5).setVisible(false);
            let btnB = this.add.rectangle(550, 550, 250, 40, 0xe67e22).setInteractive().setVisible(false);
            let btnBText = this.add.text(550, 550, '', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5).setVisible(false);

            btnA.on('pointerdown', () => answerQuiz(0, this, btnA, btnB, btnAText, btnBText));
            btnB.on('pointerdown', () => answerQuiz(1, this, btnA, btnB, btnAText, btnBText));

            // === โหมดที่ 2: หน้าห้องบอส (BOSS) ===
            bossHpText = this.add.text(400, 150, '', { fontSize: '22px', fill: '#ff7675' }).setOrigin(0.5).setVisible(false);
            
            // ปุ่มโจมตีบอส
            bossAtkBtn = this.add.rectangle(400, 350, 180, 60, 0xc0392b).setInteractive().setVisible(false);
            let bossAtkText = this.add.text(400, 350, '⚔️ โจมตีบอส!', { fontSize: '20px', fill: '#fff' }).setOrigin(0.5).setVisible(false);

            // ปุ่มหนีกลับไปเก็บเลเวล
            retreatBtn = this.add.rectangle(400, 450, 220, 40, 0x34495e).setInteractive().setVisible(false);
            let retreatText = this.add.text(400, 450, '🏃 หนีกลับไปเก็บ Lv.', { fontSize: '16px', fill: '#fff' }).setOrigin(0.5).setVisible(false);

            bossAtkBtn.on('pointerdown', () => attackBoss(this));
            retreatBtn.on('pointerdown', () => switchMode(this, 'FARM'));

            cursors = this.input.keyboard.createCursorKeys();

            // ปุ่มคีย์บอร์ด หรือระบบสัมผัสใกล้ NPC
            this.input.keyboard.on('keydown-SPACE', () => {
                if (currentMode === 'FARM' && !isTalking) {
                    let dist = Phaser.Math.Distance.Between(hero.x, hero.y, qNpc.x, qNpc.y);
                    if (dist < 60) {
                        openQuiz(btnA, btnB, btnAText, btnBText);
                    }
                }
            });

            updateUI();
        }

        function switchMode(scene, mode) {
            currentMode = mode;
            let isFarm = mode === 'FARM';

            // ซ่อน/แสดง องค์ประกอบตามโหมด
            hero.setVisible(isFarm);
            obstacles.setVisible(isFarm);
            npcs.setVisible(isFarm);
            bossBtn.setVisible(isFarm);

            bossHpText.setVisible(!isFarm);
            bossAtkBtn.setVisible(!isFarm);
            retreatBtn.setVisible(!isFarm);

            if (!isFarm) {
                scene.cameras.main.setBackgroundColor('#4a154b'); // เปลี่ยนสีพื้นหลังห้องบอส
            } else {
                scene.cameras.main.setBackgroundColor('#2c3e50');
            }
            updateUI();
        }

        function openQuiz(btnA, btnB, btnAText, btnBText) {
            isTalking = true;
            let q = questions[currentQ];
            dialogueText.setText(`[ตอบคำถามเก็บ EXP]\n${q.q}`);
            btnAText.setText(`A: ${q.a[0]}`);
            btnBText.setText(`B: ${q.a[1]}`);

            dialogueBox.setVisible(true);
            dialogueText.setVisible(true);
            btnA.setVisible(true);
            btnB.setVisible(true);
            btnAText.setVisible(true);
            btnBText.setVisible(true);
        }

        function answerQuiz(choice, scene, btnA, btnB, btnAText, btnBText) {
            let q = questions[currentQ];
            if (choice === q.correct) {
                player.exp += 30;
                alert("✅ ตอบถูกต้อง! ได้รับ +30 EXP");
                if (player.exp >= player.maxExp) {
                    player.level++;
                    player.exp -= player.maxExp;
                    player.maxExp += 30;
                    player.maxHp += 40;
                    player.hp = player.maxHp; // ฮีลเต็ม
                    player.atk += 15;
                    alert(`🎉 เลเวลอัป! เป็น Lv.${player.level} (เพิ่ม HP และ ATK เรียบร้อย)`);
                }
            } else {
                alert("❌ ตอบผิด! ไม่ได้รับ EXP");
            }

            currentQ = (currentQ + 1) % questions.length;
            dialogueBox.setVisible(false);
            dialogueText.setVisible(false);
            btnA.setVisible(false);
            btnB.setVisible(false);
            btnAText.setVisible(false);
            btnBText.setVisible(false);
            isTalking = false;
            updateUI();
        }

        function attackBoss(scene) {
            // โจมตีกันและกัน
            boss.hp -= player.atk;
            if (boss.hp > 0) {
                player.hp -= boss.atk;
            }

            // เช็กผลการต่อสู้
            if (boss.hp <= 0) {
                alert(`🏆 ชนะบอส Lv.${boss.level} สำเร็จ!\nบอสอัปเกรดเป็น Lv.${boss.level + 1} แล้ว`);
                boss.level++;
                boss.maxHp += 100;
                boss.hp = boss.maxHp;
                boss.atk += 10;
                switchMode(scene, 'FARM');
            } else if (player.hp <= 0) {
                alert("💀 คุณสู้บอสไม่ไหว HP หมด! กลับไปเก็บเลเวลเพิ่มพลังก่อนนะ");
                player.hp = player.maxHp; // ฟื้นฟูเลือดให้กลับไปฟาร์ม
                switchMode(scene, 'FARM');
            }
            updateUI();
        }

        function updateUI() {
            uiText.setText(`Player: Lv.${player.level} | EXP: ${player.exp}/${player.maxExp} | HP: ${player.hp}/${player.maxHp} | ATK: ${player.atk}`);
            bossHpText.setText(`👹 BOSS Lv.${boss.level}\nHP: ${boss.hp}/${boss.maxHp} | ATK: ${boss.atk}`);
        }

        function update() {
            if (currentMode !== 'FARM' || isTalking) {
                hero.setVelocity(0, 0);
                return;
            }

            hero.setVelocity(0);
            if (cursors.left.isDown) hero.setVelocityX(-160);
            else if (cursors.right.isDown) hero.setVelocityX(160);
            if (cursors.up.isDown) hero.setVelocityY(-160);
            else if (cursors.down.isDown) hero.setVelocityY(160);
        }
    </script>
</body>
</html>
