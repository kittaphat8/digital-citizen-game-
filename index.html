<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Quiz RPG</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
    </style>
</head>
<body>
    <script>
        // ข้อมูลตัวละคร & บอส
        let player = { level: 1, exp: 0, maxExp: 100, hp: 100, maxHp: 100, atk: 20 };
        let boss = { level: 1, hp: 150, maxHp: 150, atk: 15 };
        
        let questions = [
            { q: "หากมีคนแปลกหน้าทักมาขอรหัสผ่านเกม คุณควรทำอย่างไร?", a: ["ให้ทันที", "ปฏิเสธและบล็อก"], correct: 1 },
            { q: "การโพสต์ต่อว่าผู้อื่นด้วยถ้อยคำรุนแรง จัดเป็นสิ่งใด?", a: ["Cyberbullying", "Digital Citizen ดี"], correct: 0 },
            { q: "ก่อนแชร์ข่าวสารในโซเชียลมีเดีย ควรทำสิ่งใดก่อน?", a: ["แชร์ทันที", "เช็กความถูกต้อง"], correct: 1 }
        ];

        let currentQ = 0;
        let playerHpText, playerStatsText, bossHpText, bossStatsText, questionText, btnA, btnB, btnAText, btnBText;

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            backgroundColor: '#2c3e50',
            scene: { create: create }
        };

        const game = new Phaser.Game(config);

        function create() {
            // โซนแสดงผลบอส (ฝั่งขวา)
            this.add.rectangle(600, 200, 120, 120, 0xe74c3c);
            bossStatsText = this.add.text(520, 100, '', { fontSize: '20px', fill: '#fff' });
            bossHpText = this.add.text(520, 130, '', { fontSize: '18px', fill: '#ff7675' });

            // โซนแสดงผลผู้เล่น (ฝั่งซ้าย)
            this.add.rectangle(200, 200, 80, 80, 0x3498db);
            playerStatsText = this.add.text(120, 100, '', { fontSize: '20px', fill: '#fff' });
            playerHpText = this.add.text(120, 130, '', { fontSize: '18px', fill: '#74b9ff' });

            // กล่องคำถาม (ด้านล่าง)
            this.add.rectangle(400, 420, 740, 260, 0x000000, 0.8).setStrokeStyle(2, 0xffffff);
            questionText = this.add.text(50, 320, '', { fontSize: '20px', fill: '#fff', wordWrap: { width: 700 } });

            // ปุ่มเลือกคำตอบ A และ B
            btnA = this.add.rectangle(230, 510, 320, 50, 0x2ecc71).setInteractive();
            btnAText = this.add.text(230, 510, '', { fontSize: '18px', fill: '#fff' }).setOrigin(0.5);

            btnB = this.add.rectangle(570, 510, 320, 50, 0xe67e22).setInteractive();
            btnBText = this.add.text(570, 510, '', { fontSize: '18px', fill: '#fff' }).setOrigin(0.5);

            btnA.on('pointerdown', () => answer(0, this));
            btnB.on('pointerdown', () => answer(1, this));

            updateUI();
            loadQuestion();
        }

        function loadQuestion() {
            let q = questions[currentQ];
            questionText.setText(`[คำถาม] ${q.q}`);
            btnAText.setText(`A: ${q.a[0]}`);
            btnBText.setText(`B: ${q.a[1]}`);
        }

        function answer(choice, scene) {
            let q = questions[currentQ];
            if (choice === q.correct) {
                // ตอบถูก: โจมตีบอส + ได้ EXP
                boss.hp -= player.atk;
                player.exp += 40;
                checkLevelUp();
            } else {
                // ตอบผิด: บอสโจมตีผู้เล่น
                player.hp -= boss.atk;
            }

            // ตรวจสอบการแพ้/ชนะ
            if (boss.hp <= 0) {
                // ชนะบอส: บอสอัปเลเวลขึ้น ผู้เล่นรีเซ็ตเลเวลกลับไปเก็บใหม่
                alert(`🎉 ชนะบอส Lv.${boss.level}! บอสจะเก่งขึ้น และเริ่มเก็บเลเวลใหม่`);
                boss.level += 1;
                boss.maxHp = 150 + (boss.level * 50);
                boss.hp = boss.maxHp;
                boss.atk += 5;

                // รีเซ็ตตัวละครกลับเริ่มเก็บเลเวลใหม่
                player.level = 1;
                player.exp = 0;
                player.maxExp = 100;
                player.maxHp = 100;
                player.hp = 100;
                player.atk = 20;
            } else if (player.hp <= 0) {
                alert("💀 คุณโดนบอสโจมตีจน HP หมด! ฟื้นฟู HP แล้วลองใหม่");
                player.hp = player.maxHp;
            }

            currentQ = (currentQ + 1) % questions.length;
            updateUI();
            loadQuestion();
        }

        function checkLevelUp() {
            if (player.exp >= player.maxExp) {
                player.level += 1;
                player.exp -= player.maxExp;
                player.maxExp += 50;
                player.maxHp += 30; // อัปเลือด
                player.hp = player.maxHp; // ฮีลเต็มเมื่อเลเวลอัป
                player.atk += 10; // อัปพลังโจมตี
            }
        }

        function updateUI() {
            playerStatsText.setText(`Player Lv.${player.level} (EXP: ${player.exp}/${player.maxExp})`);
            playerHpText.setText(`HP: ${player.hp}/${player.maxHp} | ATK: ${player.atk}`);

            bossStatsText.setText(`BOSS Lv.${boss.level}`);
            bossHpText.setText(`HP: ${boss.hp}/${boss.maxHp} | ATK: ${boss.atk}`);
        }
    </script>
</body>
</html>
